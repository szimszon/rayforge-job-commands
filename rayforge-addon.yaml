name: job_commands
display_name: "Job Event Commands"
description: "Run shell commands when a job starts, reports progress, pauses, resumes, finishes or fails, and when the machine connects or disconnects."
api_version: 24
author:
  name: Szabolcs Gyuris
  email: github@oregpreshaz.eu
depends:
  - rayforge>=1.13.0
provides:
  frontend: job_commands.frontend
license:
  name: MIT

  # If your addon includes assets, list their type and location here.
  assets:
    - type: "icons"
      # The 'path' is relative to the root of this repository.
      path: "./assets/icons/"
      description: "Icons for setup window."
    - type: "ha-helper"
      # The 'path' is relative to the root of this repository.
      path: "./assets/ha-helper/"
      description: "Some helper scripts and templates to integrate to Home Assistant."

maturity: experimental